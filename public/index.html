<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<!-- Inert until slice 10 replaces it with the real icons (Q9). Without it
     every load logs a 404, which is noise when debugging on the phone. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/ui/board.css">
<style>
  :root {
    color-scheme: light;
    --ink-soft: #5b6470;
    --key: #f2f4f7;
    --key-edge: #cfd5dd;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
  }

  #app {
    container-type: inline-size;
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px;

    & h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 4px 2px 10px;
      letter-spacing: 0.01em;
    }
  }

  .layout {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: start;
  }

  .board-wrap {
    container-type: inline-size;
    width: 100%;
  }

  .side {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #status {
    margin: 0;
    min-height: 1.4em;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  #pad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .pad-key {
    font: inherit;
    font-size: 1.25rem;
    padding: 10px 0;
    min-height: 46px;
    border: 1px solid var(--key-edge);
    border-radius: 8px;
    background: var(--key);
    color: var(--ink);
    cursor: pointer;

    &.erase { grid-column: span 5; font-size: 1rem; }
    &:active { background: var(--sel); }
  }

  /* Wide: the pad sits beside the board. Narrow: beneath it — there is no
     room, and scrolling a sudoku board is worse than a small number pad.
     This block comes last so it wins on source order against the base rules
     it overrides. */
  @container (min-width: 560px) {
    .layout { flex-direction: row; }
    .board-wrap { max-width: min(62%, 72vh); }
    .side { max-width: 320px; }
    #pad { grid-template-columns: repeat(3, 1fr); }
    .pad-key.erase { grid-column: span 3; }
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    & button {
      font: inherit;
      flex: 1 1 auto;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--key-edge);
      border-radius: 8px;
      background: var(--key);
      color: var(--ink);
      cursor: pointer;
    }

    & button:disabled { color: var(--line); cursor: default; }
  }
</style>
</head>
<body>
<main id="app">
  <h1>Sudoku</h1>
  <div class="layout">
    <div class="board-wrap"><div id="board"></div></div>
    <div class="side">
      <p id="status" role="status" aria-live="polite"></p>
      <div id="pad"></div>
      <div class="controls">
        <button type="button" id="check">Check</button>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
        <button type="button" id="new-game">New game</button>
      </div>
    </div>
  </div>
</main>
<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
